# Desenvolvimento local — usar: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  db:
    ports:
      - "3306:3306"

  web:
    ports:
      - "8081:80"
    volumes:
      - ./php:/var/www/html
    environment:
      MIGRATE_ON_START: "false"

  phpmyadmin:
    profiles: ["admin"]
    ports:
      - "8080:80"