# Alias de docker-compose.yml — EasyPanel / Docker Compose v2

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ALL_IN_ONE: "1"
      DB_NAME: ${DB_NAME:-smsgateway}
      DB_USER: ${DB_USER:-smsuser}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      APP_URL: ${APP_URL:-}
      MIGRATE_KEY: ${MIGRATE_KEY:-}
      PAIRING_SECRET: ${PAIRING_SECRET:-}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - sqlite_data:/data
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  sqlite_data: